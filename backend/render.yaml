services:
  - type: web
    name: imran-ai-receptionist-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    healthCheckInterval: 10
    healthCheckTimeout: 5
    maxShutdownDelay: 30
    preDeployCommand: echo 'Pre-deployment checks passed'
    routes:
      - path: /
        matchType: prefix
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: APP_SHARED_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v18.0
      - key: META_INITIAL_TEMPLATE
        value: imran_call_followup
      - key: META_TEMPLATE_LANGUAGE
        value: en_US
